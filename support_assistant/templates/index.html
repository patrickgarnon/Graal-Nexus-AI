<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Assistant Support AI</title>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>
    <h1>Assistant Support AI</h1>
    <section x-data="salesStream()" x-init="init()">
        <h2>Ventes</h2>
        <p>Total: <span x-text="total.toFixed(2)"></span></p>
        <ul>
            <template x-for="sale in sales" :key="sale.id">
                <li x-text="sale.amount"></li>
            </template>
        </ul>
    </section>

    <script>
        function salesStream() {
            return {
                sales: [],
                total: 0,
                init() {
                    const evtSource = new EventSource('/sales/stream');
                    evtSource.onmessage = (e) => {
                        const payload = JSON.parse(e.data);
                        this.sales.push(payload.sale);
                        this.total = payload.total;
                    };
                }
            }
        }
    </script>
</body>
</html>
