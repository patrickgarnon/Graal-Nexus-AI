version: '3.8'

services:
  app:
    build:
      context: .
      args:
        PORT: ${PORT:-5000}
    environment:
      OWNER_EMAIL: ${OWNER_EMAIL:-patrickgarnon09@gmail.com}
      MAKE_API_BASE: ${MAKE_API_BASE:-https://api.make.com/v2}
      PORT: ${PORT:-5000}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    restart: unless-stopped
